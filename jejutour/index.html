<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>제주 헤리티지 자율주행 택시</title>
<script src="config.js?v=20261111g"></script>
<script src="heritage.js?v=20261111g"></script>
<link rel="stylesheet" href="common.css?v=20261111g">
<link rel="stylesheet" href="planner.css?v=20261111g">
</head>
<body data-step="0" class="resizable">
<div id="app">
  <!-- 왼쪽: 단계별 안내 -->
  <section class="panel" id="left">
    <h2><span id="leftTitle">🧭 여행 플래너</span><button id="who" class="chipBtn" hidden></button></h2>
    <div class="sizeCtl">🔍 코딩 칸 크기 <button id="zOut" title="작게">−</button><span class="lvl" id="zLvl">보통</span><button id="zIn" title="크게">＋</button><button id="btnInit" class="initBtn" title="처음부터 다시">↺ 초기화</button></div>
    <div class="steps"><span data-s="1">① 테마</span><span data-s="2">② 코스</span><span data-s="3">③ 코딩</span><span data-s="4">④ 완성</span></div>

    <div class="pane" id="p1">
      <p class="lead">어떤 여행을 하고 싶나요?<br><small>테마를 고르면 헤리티지 <b>3곳</b>을 추천해 줘요</small></p>
      <div id="themes"></div>
    </div>

    <div class="pane" id="p2">
      <p class="lead"><span id="thBadge"></span> 추천 코스<br><small>마음에 안 들면 <b>바꾸기</b> → 지도에서 다른 곳을 눌러요</small></p>
      <div id="courseList"></div>
      <button class="ghost" id="btnReroll">🔄 다른 코스 추천받기</button>
      <label class="field">코스 이름<input id="courseName" maxlength="20" placeholder="예) 시간 여행 역사 코스"></label>
      <button class="primary" id="btnToCode">🚗 코딩하러 가기</button>
    </div>

    <div class="pane" id="p3">
      <div id="mission"></div>
      <div class="palette" id="palette"></div>
    </div>

    <div class="pane" id="p4">
      <div id="card"></div>
    </div>
  </section>

  <div class="handle" id="h1" title="끌어서 크기 조절"></div>
  <!-- 가운데: 지도 -->
  <div id="boardWrap">
    <div id="board">
      <img id="bgImg" alt="제주 지도">
      <div id="layer"></div>
    </div>
    <div id="mapHint"></div>
  </div>

  <div class="handle" id="h2" title="끌어서 크기 조절"></div>
  <!-- 오른쪽: 내 코드 -->
  <section class="panel" id="right">
    <h2>📜 내 코드 <span class="count" id="count">0개</span></h2>
    <div class="workspace" id="stack"></div>
    <div id="score"></div>
    <div id="buttons">
      <button id="btnRun" class="big">▶ 실행</button>
      <button id="btnStop">■ 멈춤</button>
      <button id="btnDel">⌫ 빼기</button>
      <button id="btnClear">🗑</button>
      <button id="btnSound" title="소리">🔊</button>
      <button id="btnDone">🏁 완성하기</button>
    </div>
  </section>
</div>

<!-- 시작: 번호·이름 -->
<div id="start" class="overlay show">
  <div class="card">
    <h1>🚕 제주 헤리티지 자율주행 택시</h1>
    <p class="pickSub">선생님이 알려 준 내 번호를 눌러요</p>
    <div id="numGrid"></div>
    <button class="primary" id="btnStart" disabled>시작하기</button>
  </div>
</div>
<!-- 장소 카드 -->
<div id="spotPop" class="overlay"><div class="card spotCard" id="spotCard"></div></div>
<!-- 스탬프 -->
<div id="stampPop" class="overlay"><div class="card stampCard" id="stampCard"></div></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script src="common.js?v=20261111g"></script>
<script src="planner.js?v=20261111g"></script>
</body>
</html>
