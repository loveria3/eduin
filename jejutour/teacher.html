<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>선생님 화면 - 제주 헤리티지 택시</title>
<script src="config.js?v=20261117t"></script>
<script src="heritage.js?v=20261117t"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css?v=20261117t">
<link rel="stylesheet" href="planner.css?v=20261117t">
<style>
#nums{flex:1; min-height:0; display:grid; grid-template-columns:repeat(5, 1fr); grid-auto-rows:minmax(0,1fr); gap:6px; padding:8px; background:#f9fafc;}
.num-card{border:0; border-radius:12px; background:#fff; font:inherit; font-weight:900; cursor:pointer; padding:2px; min-width:0; min-height:0;
  box-shadow:0 2px 0 #c9d6e3, 0 0 0 2px #dbe5ef inset; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; color:#2b3a55;}
.num-card .nn{font-size:1.05em;} .num-card .nm{font-size:.7em; color:#5b6b83; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.num-card .ns{font-size:.68em; color:#ff8c1a;}
.num-card.wait{opacity:.35; cursor:default;}
.num-card.sel{background:#4c97ff; color:#fff; box-shadow:0 0 0 3px #ffe600;} .num-card.sel .nm, .num-card.sel .ns{color:#fff;}
.num-card.fresh{animation:fresh 1.2s ease-in-out 3;} @keyframes fresh{50%{background:#fff7b0; transform:scale(1.08);}}
.legend{padding:.5em .8em; font-size:.75em; color:#7a8aa3; font-weight:700; border-top:2px solid #eef2f6;}
.demoTag{background:#ff8c1a; color:#fff; border-radius:1em; padding:.1em .6em; font-size:.6em; margin-left:auto;}
#info{flex:1; min-height:0; overflow-y:auto; padding:.7em; background:#f9fafc; display:flex; flex-direction:column; gap:.6em;}
#codeList{display:flex; flex-direction:column; gap:0; --bf:calc(clamp(12px, min(1.1vw, 2vh), 20px));}
#codeList .row{margin-top:calc(var(--bf) * -.5);} #codeList .row .blk{display:block; width:max-content;} #codeList .slot > .row:first-child{margin-top:0;} #codeList .row.now .blk{filter:drop-shadow(2.5px 0 0 #ffe600) drop-shadow(-2.5px 0 0 #ffe600) drop-shadow(0 2.5px 0 #ffe600) drop-shadow(0 -2.5px 0 #ffe600);}
#ctrl{display:flex; gap:6px; padding:8px; border-top:2px solid #eef2f6; flex-wrap:wrap;}
#ctrl button{flex:1; min-height:38px; border:0; border-radius:12px; font:inherit; font-weight:900; color:#fff; cursor:pointer;}
#ctrl button:disabled{background:#c3cad4 !important; cursor:default;}
#bPlay{background:#12bd8c;} #bReset{background:#ff8c1a;} #bShow{background:#4c97ff;} #bSound{background:#9966ff; flex:.5 !important;}
#trail{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3;}
#trail polyline{fill:none; stroke:#ff3d7f; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:12 9;}
#show .planSheet{font-size:clamp(14px, min(1.5vw, 2.3vh), 22px);}
#show .card{width:min(97vw, 1300px) !important;}
#resetBox .card{text-align:center;}
#left h2{display:flex; align-items:center; gap:.4em;}
/* 기본 화면에서 글자가 두 줄로 쪼개지지 않게 */
body{word-break:keep-all;}
#left h2, #right h2{white-space:nowrap; min-width:0; font-size:clamp(15px, 1.35vw, 24px); gap:.35em;}
#left h2 .initBtn{font-size:.62em; padding:.25em .6em;} .demoTag{font-size:.55em !important;}
.demoTag{white-space:nowrap; flex:none;}
.num-card .nn{white-space:nowrap; letter-spacing:-.04em; font-size:clamp(11px, 1.05vw, 1.05em);}
#ctrl{gap:6px;}
#ctrl button{white-space:nowrap; padding:0 .25em; font-size:clamp(11px, .95vw, 1em); min-width:0;}
#ctrl #bSound{flex:none; width:2.6em;}
.legend{word-break:keep-all;}
.initBtn{margin-left:auto; border:0; border-radius:1em; padding:.25em .8em; background:#ffe1dc; color:#d23c28; font:inherit; font-weight:900; font-size:.75em; cursor:pointer; flex:none;}
.initBtn:active{transform:scale(.94); background:#ffcfc7;}

/* 지도 옆 여행 계획 카드 */
.tabs{display:flex; gap:4px; position:sticky; top:-.7em; z-index:2; background:#f9fafc; padding:.2em 0;}
.tab{flex:1; border:0; border-radius:10px; padding:.4em; font:inherit; font-weight:900; font-size:.85em; background:#e8eef5; color:#5b6b83; cursor:pointer;}
.tab.on{background:#ff8c1a; color:#fff;}
.sidePlan{background:#fff; border-radius:16px; padding:.7em .8em; box-shadow:0 0 0 3px #ffd59a inset; display:flex; flex-direction:column; gap:.45em;}
.sidePlan h3{margin:0; font-size:1.2em; color:#24323f;}
.spTags{display:flex; flex-wrap:wrap; gap:.3em;} .spTags .cat{font-size:.78em;}
.spIntro{font-weight:800; color:#40506a; font-size:.88em;}
.spTl{display:flex; flex-direction:column; gap:.3em;}
.spEtc{font-weight:800; color:#5b6b83; font-size:.82em;}
.spMove{font-size:.75em; color:#8a97a8; font-weight:700; padding-left:1.1em; border-left:3px dashed #ffb3cc; margin-left:.7em;}
.spSpot{border-radius:12px; background:#f6f9fc; padding:.45em .55em; box-shadow:0 0 0 2px #e3eaf2 inset; transition:.3s;}
.spSpot.ok{background:#eafaf1; box-shadow:0 0 0 2px #38b26d inset;}
.spSpot.now{animation:spNow .9s ease-in-out 2;}
@keyframes spNow{50%{transform:scale(1.03); box-shadow:0 0 0 4px #ffe600 inset;}}
.spHead{display:flex; align-items:center; gap:.4em; flex-wrap:wrap;}
.spHead b{font-size:.98em;} .spHead small{color:#7a8aa3; font-weight:700; font-size:.75em; margin-left:auto;}
.spNo{width:1.6em; height:1.6em; border-radius:50%; background:#ff8c1a; color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; flex:none; font-size:.85em;}
.spSpot.ok .spNo{background:#38b26d;}
.spLine{font-size:.8em; font-weight:700; color:#5b6b83; margin-top:.2em;} .spLine.say{color:#1976d2;}
.spStat{display:flex; flex-wrap:wrap; gap:.3em .7em; align-items:center; font-size:.8em; font-weight:800; color:#5b6b83; border-top:2px dashed #eef2f6; padding-top:.4em;}
.spStat b{color:#24323f;} .spSc{margin-left:auto; background:#ff8c1a; color:#fff; border-radius:1em; padding:.1em .6em; font-size:1.15em;}
.spTags .sy{background:#eef2ff; color:#3730a3;} .spBox.av{background:#f5f9ff; color:#1e3a8a; box-shadow:0 0 0 1px #bfdbfe inset;}
.spBox{background:#fff8ec; border-radius:10px; padding:.4em .55em; font-size:.8em; font-weight:700; color:#6b5a3a;} .spBox.tip{background:#eef6ff; color:#2b5a9a;}
.spBig{border:0; border-radius:10px; padding:.45em; font:inherit; font-weight:900; font-size:.82em; background:#eef2f6; color:#4a5a72; cursor:pointer;}
/* 지도를 조금 줄이고 오른쪽 설명 칸을 넓게 */
#app{grid-template-columns:minmax(0,.85fr) auto minmax(0,1.35fr);}
#board{height:min(calc(100dvh - 60px), 36vw);}
/* 🖥 발표: 번호판 숨기고 지도 + 큰 카드 */
body.present #left{display:none;}
body.present #app{grid-template-columns:auto minmax(0,1fr); grid-template-areas:"board right";}
body.present #board{height:min(calc(100dvh - 60px), 38vw);}
body.present #info{font-size:clamp(15px, 1.25vw, 24px);}
body.present #right h2{font-size:clamp(18px, 1.6vw, 30px);}

/* 중학생 톤 */
.tab{font-weight:700; border-radius:8px;} .tab.on{background:var(--ink);}
.sidePlan{box-shadow:0 0 0 1px var(--line) inset; border-radius:12px;}
.spSpot{box-shadow:0 0 0 1px var(--line) inset;} .spSpot.ok{box-shadow:0 0 0 1.5px var(--accent) inset; background:#eef8f6;}
.spSpot.ok .spNo{background:var(--accent) !important;}
#bPlay{background:var(--accent);} #bReset{background:#64748b;} #bShow{background:#1d4ed8;} #bSound{background:#94a3b8;}
#ctrl button{border-radius:10px; font-weight:700;}
.num-card{border-radius:10px; box-shadow:0 0 0 1px var(--line) inset; font-weight:800;}
.num-card.sel{background:#1d4ed8; box-shadow:0 0 0 3px #fbbf24;}
.demoTag{background:var(--point);}
</style>
</head>
<body data-step="3">
<div id="app">
  <section class="panel" id="left">
    <h2>👩‍🏫 우리 반 <span class="demoTag" id="demoTag"></span><button id="bInit" class="initBtn" title="화면과 기록을 처음 상태로">↺ 초기화</button></h2>
    <div id="nums"></div>
    <div class="legend">번호를 누르면 오른쪽에 여행 계획이 나와요 · 흐린 번호는 아직 안 보냈어요<br><span id="status"></span></div>
  </section>

  <div id="boardWrap">
    <div id="board"><img id="bgImg" alt="제주 지도"><div id="layer"></div></div>
    <div id="mapHint">번호를 눌러 친구의 코스를 확인해요</div>
  </div>

  <section class="panel" id="right">
    <h2 id="who2">📜 친구의 코스</h2>
    <div id="info"><div class="insertHint">👈 번호를 누르세요</div></div>
    <div id="ctrl">
      <button id="bPlay" disabled>▶ 재생</button><button id="bReset" disabled>↺ 처음</button>
      <button id="bShow" disabled title="발표 화면">🖥 발표</button><button id="bSound">🔊</button>
    </div>
  </section>
</div>

<div id="show" class="overlay planPop"><div class="card" id="showCard"></div></div>
<div id="resetBox" class="overlay"><div class="card"><h1>↺ 초기화할까요?</h1><p id="resetTxt">학생들이 보낸 기록이 모두 지워지고 되돌릴 수 없어요.</p>
  <div id="resetMsg"></div><button class="primary" id="resetGo" style="background:#e0533d">지우기</button> <button class="ghost" id="resetNo">취소</button></div></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script src="common.js?v=20261117t"></script>
<script>
const board = $('board'), layer = $('layer');
function updateCellVar(){ board.style.setProperty('--cell', board.clientWidth * cellSize() / 100 + 'px'); }
const SERVER = (window.SERVER_URL || '').trim();
const DEMO = !SERVER || location.search.includes('demo');
const N = window.CLASS_SIZE || 30;
const DATA = {};                                  // 번호 → 기록
let cur = null, curNo = null, st, playing = false, stopFlag = false, car, pins = [], trail = [];

/* ---------- 예시 데이터 ---------- */
function demoData(){
  const names = ['김하늘','이바다','박한라','최오름','정돌담','강해녀','조귤','윤바람','장노을','임별','한숲','오섬'];
  const nos = [1,2,3,5,6,8,9,11,13,14,17,20];
  nos.forEach((no, k) => {
    const th = Object.keys(THEMES)[k % 5], s = recommend(th), p = autoProgram(s);
    if (k % 4 === 3) p.splice(-1, 1);                    // 하나는 마지막 안내를 빠뜨림
    if (k % 3 === 1) p.unshift({ t:'turn', dir:'L', deg:90 }, { t:'turn', dir:'R', deg:90 });
    const st = k % 4 === 3 ? s.slice(0, 2) : s.slice();
    const sc = calcScore(p, st.length, 0).total;
    DATA[no] = { no, th, s, cn:THEMES[th].name + ' 코스', tg:['가족','친구','외국인 관광객'][k % 3], ln:'제주의 ' + THEMES[th].name + '을(를) 한 번에!', p, st, sc,
      se:['봄','여름','가을','겨울'][k % 4], why:k % 2 ? '' : '하루 만에 ' + THEMES[th].name + ' 명소 세 곳을 알차게 둘러볼 수 있어요.', tip:k % 3 ? '편한 운동화와 물을 챙겨요' : '',
      sy:[STYLE_OPTS[k % 6], STYLE_OPTS[(k + 2) % 6]].slice(0, k % 3 ? 2 : 1), av:k % 4 ? Object.keys(AV_OPTS)[k % 5] : '' };
  });
}

/* ---------- 번호 카드 ---------- */
function makeCards(){
  $('nums').innerHTML = Array.from({ length:N }, (_, i) => `<button class="num-card wait" data-no="${i + 1}"><span class="nn">${i + 1}번</span><span class="nm"></span><span class="ns"></span></button>`).join('');
  $('nums').querySelectorAll('.num-card').forEach(b => b.onclick = () => select(+b.dataset.no));
}
function refreshCards(fresh = []){
  $('nums').querySelectorAll('.num-card').forEach(c => {
    const no = +c.dataset.no, d = DATA[no];
    c.classList.toggle('wait', !d);
    c.querySelector('.nm').textContent = d ? THEMES[d.th].icon + ' ' + THEMES[d.th].name : '';
    c.querySelector('.ns').textContent = d ? '⭐'.repeat(d.st.length) || '☆' : '';
    if (fresh.includes(no)){ c.classList.remove('fresh'); void c.offsetWidth; c.classList.add('fresh'); }
  });
}

/* ---------- 지도 ---------- */
function buildBoard(){
  layer.innerHTML = '<svg id="trail" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="trailLine" vector-effect="non-scaling-stroke"/></svg>';
  board.style.aspectRatio = `${IMG.w} / ${IMG.h}`;
  const sm = document.createElement('div'), r = cellRect(START.row, START.col);
  sm.className = 'startMark'; sm.innerHTML = '<span>✈️ 출발</span>';
  Object.assign(sm.style, { left:r.x+'%', top:r.y+'%', width:r.w*.94+'%', height:r.h*.94+'%' });
  layer.appendChild(sm);
  car = document.createElement('div'); car.id = 'car'; car.className = 'cellObj';
  car.innerHTML = `<div class="inner">${CAR_SVG}</div>`; layer.appendChild(car);
}
function drawPins(stamps){
  pins.forEach(p => p.remove()); pins = [];
  if (!cur) return;
  cur.s.forEach((id, i) => {
    const s = SPOT[id], ok = stamps.includes(id), p = document.createElement('div');
    p.className = 'pin' + (ok ? ' ok' : '');
    p.style.left = s.x / IMG.w * 100 + '%'; p.style.top = s.y / IMG.h * 100 + '%';
    p.innerHTML = `<div class="pn"><span>${ok ? '✓' : i + 1}</span></div><div class="pl">${esc(s.key)}</div>`;
    layer.appendChild(p); pins.push(p);
  });
}
function drawCar(animate){
  car.style.setProperty('--mv', animate ? STEP_MS + 'ms' : '0ms');
  place(car, st.row, st.col, CAR_WIDTH_CM / 10 / 0.92);
  car.style.transform = `translate(-50%,-50%) rotate(${st.rot}deg)`;
}
function addTrail(){ const r = cellRect(st.row, st.col); trail.push(r.x + ',' + r.y); $('trailLine').setAttribute('points', trail.join(' ')); }
function resetRun(){
  stopFlag = true; Voice.stop();
  st = { row:START.row, col:START.col, dir:START.dir, rot:START.dir * 90 };
  trail = []; addTrail(); drawCar(false); drawPins([]);
  $('codeList') && $('codeList').querySelectorAll('.row').forEach(r => r.classList.remove('now', 'err'));
  layer.querySelectorAll('.bubble').forEach(b => b.remove());
}

/* ---------- 학생 선택 · 정보 ---------- */
function select(no){
  const d = DATA[no]; if (!d) return;
  Sound.unlock(); curNo = no; cur = d;
  $('nums').querySelectorAll('.num-card').forEach(c => c.classList.toggle('sel', +c.dataset.no === no));
  $('who2').textContent = `📜 ${no}번 ${d.nm || ''}`;
  const t = THEMES[d.th], sc = calcScore(d.p, d.st.length, 0);
  $('info').innerHTML = `<div class="tabs"><button class="tab on" data-tab="plan">📜 여행 계획</button><button class="tab" data-tab="code">🧩 코드</button></div>
    <div id="tabPlan">${sidePlanHTML(d)}</div>
    <div id="tabCode" hidden><div id="codeList">${HAT_SVG}${rowsHTML(d.p, '', false)}</div></div>`;
  $('info').querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('spBig').onclick = showCard;
  ['bPlay', 'bReset', 'bShow'].forEach(id => $(id).disabled = false);
  resetRun(); drawPins([]);
  $('mapHint').textContent = `${no}번 ${d.nm || ''} · ${t.icon} ${t.name} · ▶ 재생을 눌러요`;
}
function setTab(k){
  $('info').querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  $('tabPlan').hidden = k !== 'plan'; $('tabCode').hidden = k !== 'code';
}
/* 지도 옆 여행 계획 카드: 재생하면 도착한 곳이 차례로 초록 ✓ */
function sidePlanHTML(d){
  const t = THEMES[d.th], P = makePlan(d), sc = d.sc ?? calcScore(d.p, d.st.length, 0).total;
  const tags = [`<span class="cat" style="background:${t.color};color:#fff">${t.icon} ${t.name}</span>`,
    d.tg ? `<span class="cat">👥 ${esc(d.tg)}</span>` : '', d.se ? `<span class="cat">🗓 ${esc(d.se)}</span>` : '', ...(d.sy || []).map(v => `<span class="cat sy">${esc(v)}</span>`)].join('');
  const rows = P.items.map(it => {
    if (it.k === 'move') return `<div class="spMove">🚕 약 ${it.min}분 · ${it.km}km</div>`;
    if (it.k === 'spot'){ const s = it.s;
      return `<div class="spSpot" data-id="${s.id}"><div class="spHead"><span class="spNo">${it.n}</span><b>${esc(s.name)}</b><small>${hhmm(it.time)} 도착 · ${it.stay}분</small></div>
        <div class="spLine">🔎 ${esc(s.mission)}</div>${it.say ? `<div class="spLine say">🗣 "${esc(it.say)}"</div>` : ''}</div>`; }
    if (it.k === 'lunch') return `<div class="spEtc">🍜 ${hhmm(it.time)} 점심 · 쉬는 시간</div>`;
    return `<div class="spEtc">${it.k === 'start' ? '✈️' : '🏁'} ${hhmm(it.time)} ${esc(it.title)}</div>`;
  }).join('');
  return `<div class="sidePlan">
    <h3>${esc(d.cn || t.name + ' 코스')}</h3>
    <div class="spTags">${tags}</div>
    <div class="spIntro">💬 ${esc(d.ln || THEME_DESC[d.th] || '')}</div>
    <div class="spTl">${rows}</div>
    <div class="spStat"><span>📏 <b>${P.km}</b>km</span><span>⏱ <b>${hhmm(9 * 60)}~${hhmm(P.end)}</b></span><span>🧱 <b>${P.blocks}</b>블록</span><span class="spSc">${sc}점</span></div>
    ${d.av ? `<div class="spBox av">🚕 <b>자율주행 포인트</b> ${esc(d.av)} · ${esc(AV_OPTS[d.av] || '')}</div>` : ''}
    ${d.why ? `<div class="spBox">💡 <b>추천 이유</b> ${esc(d.why)}</div>` : ''}
    ${d.tip ? `<div class="spBox tip">🎒 <b>준비물·팁</b> ${esc(d.tip)}</div>` : ''}
    <button class="spBig" id="spBig">📄 여행 계획서 크게 보기</button>
  </div>`;
}
function markSide(got, nowId){
  $('info').querySelectorAll('.spSpot').forEach(el => {
    const id = +el.dataset.id; el.classList.toggle('ok', got.includes(id)); el.classList.toggle('now', id === nowId);
    el.querySelector('.spNo').textContent = got.includes(id) ? '✓' : cur.s.indexOf(id) + 1;
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function play(){
  if (!cur || playing) return;
  resetRun(); markSide([], null); await sleep(300); stopFlag = false; playing = true; $('bPlay').textContent = '⏸ 멈춤';
  const d = cur, got = [];
  for (const s of expand(d.p)){
    if (stopFlag || d !== cur) break;
    $('codeList').querySelectorAll('.row').forEach(r => r.classList.toggle('now', r.dataset.path === s.src));
    if (s.k === 'loop'){ await sleep(150); continue; }
    if (s.k === 'cell'){
      const [dr, dc] = DIRS[st.dir], nr = st.row + dr * s.sign, nc = st.col + dc * s.sign, t = cellType(nr, nc);
      if (t !== 'land'){ Sound.warn(); bumpCar(s.sign, STEP_MS); bubble(layer, st.row, st.col, BLOCK_MSG[t], '', 2200);
        $('codeList').querySelector(`.row[data-path="${s.src}"]`)?.classList.add('err'); break; }
      st.row = nr; st.col = nc; drawCar(true); Sound.ding(1319); await sleep(STEP_MS + 60); addTrail();
    }
    if (s.k === 'turn'){ st.dir = (st.dir + s.d + 8) % 4; st.rot += s.d * 90; drawCar(true); await sleep(STEP_MS); }
    if (s.k === 'wait') await sleep(Math.min(3, s.sec) * 1000);
    if (s.k === 'speak'){
      bubble(layer, st.row, st.col, (s.voice ? '🔊 ' : '💬 ') + s.text, 'talk', 2600);
      await (s.voice ? Voice.speak(s.text) : sleep(1600));
      spotsAt(st.row, st.col).forEach(h => { if (d.s.includes(h.id) && saysName(s.text, h) && !got.includes(h.id)){ got.push(h.id); Sound.ding(1568); } });
      drawPins(got);
      const nowEl = got.length && $('info').querySelector(`.spSpot[data-id="${got[got.length - 1]}"]`);
      markSide(got, got[got.length - 1]); nowEl && nowEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  }
  playing = false; $('bPlay').textContent = '▶ 다시 재생';
  if (!stopFlag && got.length === d.s.length){ Sound.win(); Confetti.burst(); }
}

/* ---------- 발표 화면 ---------- */
function showCard(){
  const d = cur; if (!d) return;
  $('showCard').innerHTML = planSheetHTML({ ...d, no:d.no ?? curNo }) + `<div class="pbtns">
      <button class="primary" id="showRun">🚕 지도에서 달려 보기</button>
      <button class="primary" id="showImg" style="background:#4c97ff;box-shadow:0 4px 0 #2f6fd0">🖼 이미지 저장</button>
      <button class="ghost" id="showClose">닫기</button></div>`;
  $('show').classList.add('show');
  const close = () => $('show').classList.remove('show');
  $('showClose').onclick = close;
  $('showRun').onclick = () => { close(); play(); };
  $('showImg').onclick = async () => {
    try { await savePlanImage({ ...d, no:d.no ?? curNo }, `${d.no ?? curNo}번_여행계획서`); toast('🖼 저장했어요'); }
    catch(e){ toast('저장하지 못했어요: ' + e.message); }
  };
}
$('show').onclick = e => { if (e.target.id === 'show') $('show').classList.remove('show'); };

/* ---------- 구글 시트 ---------- */
async function load(){
  try {
    const j = await (await fetch(SERVER + (SERVER.includes('?') ? '&' : '?') + 't=' + Date.now())).json();
    const next = {};
    (j.list || []).forEach(r => { const d = decodeRecord(r.path); if (d && +r.no >= 1){ d.p = normProg(d.p); d.no = +r.no; next[d.no] = d; } });
    const fresh = Object.keys(next).filter(no => JSON.stringify(DATA[no]) !== JSON.stringify(next[no])).map(Number);
    Object.keys(DATA).forEach(k => delete DATA[k]); Object.assign(DATA, next);
    refreshCards(fresh);
    $('status').textContent = `✓ ${Object.keys(DATA).length}명 보냄 · 5초마다 새로고침`;
  } catch(e){ $('status').textContent = '⚠ 불러오지 못했어요 (인터넷·config.js 주소 확인)'; }
}
async function clearAll(){
  $('resetMsg').textContent = '지우는 중…';
  try { await fetch(SERVER, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ action:'clear' }) }); } catch(e){}
  await load();
  if (Object.keys(DATA).length){ $('resetMsg').textContent = '지우지 못했어요. Apps Script 배포를 확인해 주세요'; return; }
  $('resetBox').classList.remove('show'); clearView(); refreshCards();
  toast('↺ 초기화했어요');
}
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.className = 'show ok'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2500); }
/* 화면을 처음 상태로: 선택·재생·발표 화면 닫기 */
function clearView(){
  resetRun(); playing = false; cur = null; curNo = null;
  $('bPlay').textContent = '▶ 재생'; ['bPlay', 'bReset', 'bShow'].forEach(id => $(id).disabled = true);
  $('nums').querySelectorAll('.num-card').forEach(c => c.classList.remove('sel'));
  $('who2').textContent = '📜 친구의 코스';
  $('info').innerHTML = '<div class="insertHint">👈 번호를 누르세요</div>';
  $('mapHint').textContent = '번호를 눌러 친구의 코스를 확인해요';
  $('show').classList.remove('show');
}
function demoClear(){
  Object.keys(DATA).forEach(k => delete DATA[k]);
  $('resetBox').classList.remove('show'); clearView(); refreshCards();
  $('status').textContent = '예시 데이터를 지웠어요 (새로고침하면 다시 보여요)';
  toast('↺ 초기화했어요');
}

/* ---------- 시작 ---------- */
$('bPlay').onclick = () => { if (playing){ stopFlag = true; Voice.stop(); } else play(); };
$('bReset').onclick = () => { resetRun(); playing = false; $('bPlay').textContent = '▶ 재생'; };
$('bShow').onclick = () => {                 // 🖥 발표: 번호판을 숨기고 지도 + 큰 계획 카드
  const on = document.body.classList.toggle('present');
  $('bShow').textContent = on ? '↩ 번호판' : '🖥 발표';
  if (on && $('tabPlan')) setTab('plan');
  requestAnimationFrame(updateCellVar);
};
$('bSound').onclick = () => { Sound.unlock(); const on = Sound.toggle(); Voice.set(on); $('bSound').textContent = on ? '🔊' : '🔇'; };
$('bgImg').onload = $('bgImg').onerror = () => {
  buildBoard(); makeCards(); updateCellVar(); resetRun();
  $('demoTag').textContent = DEMO ? '예시' : '실시간'; $('demoTag').title = DEMO ? '예시 데이터 (config.js에 주소를 넣으면 실제 기록)' : '';
  if (DEMO){ demoData(); refreshCards(); $('status').textContent = '예시 데이터 (config.js에 주소를 넣으면 실제 기록)'; }
  else { load(); setInterval(load, 5000); }
  $('bInit').onclick = () => {
    $('resetMsg').textContent = '';
    $('resetTxt').textContent = DEMO ? '예시 기록과 화면을 모두 지워요.' : '학생들이 보낸 기록이 모두 지워지고 되돌릴 수 없어요.';
    $('resetBox').classList.add('show');
  };
  $('resetGo').onclick = DEMO ? demoClear : clearAll;
  $('resetNo').onclick = () => $('resetBox').classList.remove('show');
};
$('bgImg').src = BG_IMAGE;
addEventListener('resize', updateCellVar);
</script>
</body>
